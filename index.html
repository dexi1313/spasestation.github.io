<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Космическая станция</title>
<style>
:root{--bg1:#120a2e;--bg2:#2a0f4f;--panel:rgba(255,255,255,.08);--text:#fff;--muted:#c3b8ff;--cyan:#22e4ff;--pink:#ff4fd8;--gold:#ffd23f;--lime:#7dff6b;--orange:#ff8a3d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);background:radial-gradient(ellipse at top,var(--bg2),var(--bg1) 70%);background-attachment:fixed;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
.wrap{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;padding-bottom:30px}
h1{font-size:24px;margin:16px 0 4px;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.stats{width:100%;text-align:center;background:var(--panel);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:14px;backdrop-filter:blur(6px)}
.credits{font-size:40px;font-weight:800;color:var(--gold);text-shadow:0 0 18px rgba(255,210,63,.6)}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.pps{color:var(--lime);font-weight:700;font-size:16px;margin-top:4px}
#mine{position:relative;margin:26px auto 8px;width:200px;height:200px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fff 0,var(--cyan) 22%,#5b2cff 70%,#2a0f4f 100%);box-shadow:0 0 0 6px rgba(34,228,255,.25),0 0 50px rgba(34,228,255,.6);font-size:88px;display:flex;align-items:center;justify-content:center;animation:float 3s ease-in-out infinite,halo 2s ease-in-out infinite;transition:transform .08s;user-select:none;-webkit-tap-highlight-color:transparent}
#mine:active,#mine.hit{transform:scale(.9)}
#mine .ico{display:inline-block;animation:spin 6s linear infinite}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes halo{50%{box-shadow:0 0 0 22px rgba(34,228,255,0),0 0 70px rgba(255,79,216,.7)}}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{color:var(--muted);font-size:13px;margin-bottom:6px}
.float{position:fixed;transform:translate(-50%,-50%);font-weight:800;font-size:22px;color:var(--gold);text-shadow:0 0 10px #000,0 0 4px var(--orange);pointer-events:none;animation:up .9s ease-out forwards;z-index:30}
@keyframes up{to{transform:translate(-50%,-140px) scale(1.3);opacity:0}}
.burst{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:29;animation:boom .6s ease-out forwards}
@keyframes boom{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.banner{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,var(--pink),var(--orange),var(--gold));color:#1a0820;padding:10px 20px;border-radius:999px;font-weight:800;z-index:40;display:none;white-space:nowrap;animation:bob .8s ease-in-out infinite;box-shadow:0 0 24px rgba(255,79,216,.7)}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}
.met{position:fixed;font-size:26px;pointer-events:none;z-index:25;animation:fall 1.2s linear forwards}
@keyframes fall{to{transform:translate(-260px,700px) rotate(-30deg);opacity:0}}
.ad{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;padding:12px 14px;border-radius:16px;background:linear-gradient(90deg,rgba(125,255,107,.18),rgba(34,228,255,.18));border:1px solid var(--lime)}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;cursor:pointer;padding:11px 16px;white-space:nowrap;transition:transform .1s}
.btn:active{transform:scale(.95)}
.btn:disabled{background:#4a3f70!important;color:#9a90c0!important;box-shadow:none!important;cursor:default}
.ad .btn{background:linear-gradient(90deg,var(--lime),var(--cyan));color:#06202a;box-shadow:0 0 16px rgba(125,255,107,.6)}
h2{width:100%;font-size:17px;margin:22px 0 10px;color:var(--cyan);text-shadow:0 0 10px rgba(34,228,255,.5)}
.shop{width:100%;display:flex;flex-direction:column;gap:10px}
.mod{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--panel);border:1px solid rgba(255,255,255,.12);transition:transform .2s}
.mod.locked{opacity:.4;filter:grayscale(.6)}
.mod .ic{font-size:34px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 14px var(--c1);flex-shrink:0}
.mod .info{flex:1;min-width:0}
.mod b{display:block;font-size:15px}
.mod small{color:var(--muted);font-size:12px}
.mod .lv{color:var(--gold);font-weight:800;margin-left:4px}
.mod .btn{background:linear-gradient(90deg,var(--c1),var(--c2));color:#fff;box-shadow:0 0 12px var(--c1)}
.mod.flash{animation:flash .5s}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--gold)}100%{box-shadow:0 0 0 18px transparent}}
.prestige{width:100%;margin-top:14px;padding:16px;font-size:17px;color:#fff;background:linear-gradient(90deg,#7a2cff,var(--pink),var(--orange));box-shadow:0 0 22px rgba(255,79,216,.6);animation:shine 2.5s linear infinite;background-size:200% 100%}
@keyframes shine{to{background-position:200% 0}}
.info-txt{color:var(--muted);font-size:13px;text-align:center;margin-top:6px;min-height:18px}
.msg{color:var(--lime);font-weight:700;text-align:center;margin-top:8px;min-height:20px}
.adslot{width:100%;min-height:60px;margin-top:20px;border-radius:14px;border:2px dashed rgba(255,255,255,.25);color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:center}
.hide{display:none!important}
.tabs{width:100%;max-width:520px;display:flex;gap:8px;margin-top:12px}
.tab{flex:1;font:inherit;font-weight:800;font-size:14px;padding:11px 6px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:var(--panel);color:var(--muted);cursor:pointer;transition:all .2s}
.tab.on{background:linear-gradient(90deg,var(--cyan),var(--pink));color:#120a2e;border-color:transparent;box-shadow:0 0 16px rgba(34,228,255,.5)}
.screen-in{animation:slideIn .4s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.stage{position:relative;width:100%;height:320px;margin-top:12px;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 40%,var(--st1,#22e4ff),var(--st2,#120a2e) 75%);border:1px solid rgba(255,255,255,.15);box-shadow:0 0 40px var(--st1,#22e4ff)}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:90px;animation:fly 9s ease-in-out infinite;filter:drop-shadow(0 0 20px var(--st1,#22e4ff))}
@keyframes fly{0%{transform:translate(calc(-50% - 70px),calc(-50% + 20px)) rotate(-6deg)}25%{transform:translate(calc(-50% + 30px),calc(-50% - 40px)) rotate(4deg)}50%{transform:translate(calc(-50% + 90px),calc(-50% + 15px)) rotate(-3deg)}75%{transform:translate(calc(-50% + 0px),calc(-50% + 45px)) rotate(3deg)}100%{transform:translate(calc(-50% - 70px),calc(-50% + 20px)) rotate(-6deg)}}
.amb{position:absolute;font-size:22px;opacity:.85;pointer-events:none;animation:cross var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes cross{from{transform:translateX(-40px) rotate(0deg)}to{transform:translateX(520px) rotate(360deg)}}
.ring{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a))}
.ring span{position:absolute;left:120px;top:0;transform:translate(-50%,-50%);font-size:24px;filter:drop-shadow(0 0 6px #fff9)}
.cgrid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:18px;padding:14px;text-align:center;background:linear-gradient(160deg,var(--st1),var(--st2));border:1px solid rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;gap:8px}
.prev{font-size:48px;filter:drop-shadow(0 0 10px var(--st1))}
.card .btn{background:#fff;color:#120a2e;width:100%}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="banner" id="banner"></div>
<nav class="tabs"><button class="tab on" data-t="play">🎮 Добыча</button><button class="tab" data-t="station">🛰️ Станция</button></nav>
<div class="wrap" id="scrPlay">
  <h1>🛰️ Космическая станция</h1>

  <div class="stats">
    <div class="credits" id="credits">0 💰</div>
    <div class="pps" id="pps">0 💰/с</div>
    <div class="sub" id="cores">✨ Звёздные ядра: 0 (бонус +0%)</div>
  </div>

  <button id="mine" aria-label="Добыть астероид"><span class="ico">🪨</span></button>
  <div class="hint">Нажимай на астероид! <span id="clickval"></span></div>

  <div class="ad">
    <span id="adtext">📺 Реклама: x2 к доходу на 60 сек</span>
    <button class="btn" id="adbtn">▶ Смотреть</button>
  </div>

  <h2>🚀 Модули станции</h2>
  <div class="shop" id="shop"></div>

  <h2>🌌 Перезапуск</h2>
  <button class="btn prestige" id="prestigebtn" disabled>🌌 Перезапуск станции</button>
  <div class="info-txt" id="prestigeinfo"></div>

  <div class="msg" id="msg"></div>
  <div class="adslot">Место для баннера рекламы</div>
</div>

<div class="wrap hide" id="scrStation">
  <h2>🛰️ Твоя станция</h2>
  <div class="stage" id="stage"></div>
  <div class="info-txt" id="stationinfo"></div>
</div>
<div class="wrap hide" id="scrCosm">
  <h2>🎨 Косметика станции</h2>
  <div class="info-txt">Меняет облик станции. Покупается за 💰 и надевается в один клик.</div>
  <div class="cgrid" id="cgrid"></div>
</div>

<script>
const SKINS = [
  {id:'classic', name:'Классика',    icon:'🛰️', price:0,       st1:'#22e4ff', st2:'#120a2e'},
  {id:'neon',    name:'Неон',        icon:'🛸', price:50000,   st1:'#ff4fd8', st2:'#2a0a3a'},
  {id:'gold',    name:'Золото',      icon:'🚀', price:2000000, st1:'#ffd23f', st2:'#3a2400'},
  {id:'ice',     name:'Ледяная',     icon:'🧊', price:20000000, st1:'#9be9ff', st2:'#0a2a4a'},
  {id:'lava',    name:'Вулкан',      icon:'🌋', price:200000000, st1:'#ff5a1f', st2:'#3a0a00'},
  {id:'nebula',  name:'Туманность',  icon:'🌌', price:2000000000, st1:'#a06bff', st2:'#0a0520'}
];
const DEFS = [
  {id:'solar', icon:'☀️', name:'Солнечные панели', desc:'Базовая энергия',          base:15,     prod:1,    c1:'#ffd23f', c2:'#ff8a3d'},
  {id:'drill', icon:'🤖', name:'Бур-дроны',        desc:'+0.5 к добыче за клик',    base:100,    prod:6,    c1:'#22e4ff', c2:'#3d7bff'},
  {id:'lab',   icon:'🔬', name:'Лаборатория',      desc:'Исследования',             base:600,    prod:30,   c1:'#7dff6b', c2:'#16c172'},
  {id:'port',  icon:'🛸', name:'Торговый порт',    desc:'Торговля с колониями',     base:4000,   prod:170,  c1:'#ff4fd8', c2:'#8a2cff'},
  {id:'core',  icon:'⚛️', name:'Гиперреактор',     desc:'Энергия звёзд',            base:30000,  prod:1000, c1:'#ff8a3d', c2:'#ff2e63'},
  {id:'gate',  icon:'🌀', name:'Врата',            desc:'Связь с другими секторами', base:250000, prod:6500, c1:'#fff36b', c2:'#ff4fd8'}
];
const GROWTH = 1.15, LIFE_PER_CORE = 1e6, OFFLINE_CAP = 8*3600, OFFLINE_RATE = 0.5, AD_MS = 60000, EVENT_MS = 15000;

let S = { credits:0, life:0, owned:{}, t:Date.now(), adUntil:0, cosm:{classic:true}, skin:'classic' };
let eventUntil = 0, nextEvent = Date.now() + 90000;
DEFS.forEach(d => { if (S.owned[d.id] === undefined) S.owned[d.id] = 0; });

const $ = id => document.getElementById(id);
const fmt = n => {
  if (n < 1000) return Math.floor(n).toString();
  const u = ['K','M','B','T','Qa','Qi']; let i = -1;
  while (n >= 1000 && i < u.length-1) { n /= 1000; i++; }
  return n.toFixed(n < 10 ? 2 : 1) + u[i];
};
const cores = () => Math.floor(Math.sqrt(S.life / LIFE_PER_CORE));
const coreMult = () => 1 + cores() * 0.1;
const adMult = () => (Date.now() < S.adUntil ? 2 : 1) * (Date.now() < eventUntil ? 3 : 1);
const cost = d => Math.ceil(d.base * Math.pow(GROWTH, S.owned[d.id]));
const perSec = () => DEFS.reduce((s,d) => s + S.owned[d.id] * d.prod, 0) * coreMult() * adMult();
const clickVal = () => (1 + S.owned.drill * 0.5) * coreMult() * adMult();
const earn = x => { S.credits += x; S.life += x; };

/* ---------- звук ---------- */
let AC = null;
function sfx(type) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    const P = {
      click:   {f:[660,1320], d:.08, type:'square',   v:.05},
      buy:     {f:[520,1040], d:.25, type:'triangle', v:.12},
      prestige:{f:[220,880],  d:.9,  type:'sawtooth', v:.07},
      meteor:  {f:[400,120],  d:.5,  type:'sine',     v:.1},
      ding:    {f:[1200,1500],d:.15, type:'sine',     v:.08}
    }[type];
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = P.type;
    o.frequency.setValueAtTime(P.f[0], t);
    o.frequency.exponentialRampToValueAtTime(P.f[1], t + P.d);
    g.gain.setValueAtTime(P.v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + P.d);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + P.d);
  } catch (e) {}
}

/* ---------- эффекты ---------- */
function burst(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const b = document.createElement('div');
    b.className = 'burst';
    const a = Math.random() * Math.PI * 2, r = 40 + Math.random() * 50;
    b.style.background = color;
    b.style.left = x + 'px'; b.style.top = y + 'px';
    b.style.setProperty('--dx', Math.cos(a) * r + 'px');
    b.style.setProperty('--dy', Math.sin(a) * r + 'px');
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 650);
  }
}
function floatText(x, y, text) {
  const p = document.createElement('div');
  p.className = 'float'; p.textContent = text;
  p.style.left = x + 'px'; p.style.top = y + 'px';
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 900);
}
function spawnMeteor() {
  const m = document.createElement('div');
  m.className = 'met'; m.textContent = Math.random() < .5 ? '☄️' : '🌠';
  m.style.left = (Math.random() * 100) + 'vw'; m.style.top = '-40px';
  document.body.appendChild(m);
  setTimeout(() => m.remove(), 1300);
}

/* ---------- фон-звёзды ---------- */
const cv = $('stars'), cx = cv.getContext('2d');
let stars = [];
function resize() {
  cv.width = innerWidth; cv.height = innerHeight;
  stars = Array.from({length: 120}, () => ({x:Math.random()*cv.width, y:Math.random()*cv.height, z:Math.random()*1.5+.3, tw:Math.random()*6}));
}
addEventListener('resize', resize); resize();
(function starLoop(t) {
  cx.clearRect(0, 0, cv.width, cv.height);
  for (const s of stars) {
    s.y += s.z * 0.25; if (s.y > cv.height) s.y = 0;
    const a = .4 + .6 * Math.abs(Math.sin(t/800 + s.tw));
    cx.fillStyle = `rgba(255,255,255,${a})`;
    cx.beginPath(); cx.arc(s.x, s.y, s.z, 0, 7); cx.fill();
  }
  requestAnimationFrame(starLoop);
})(0);

/* ---------- действия ---------- */
$('mine').onclick = e => {
  const v = clickVal();
  earn(v); sfx('click');
  const b = $('mine');
  b.classList.remove('hit'); void b.offsetWidth; b.classList.add('hit');
  const x = e.clientX || innerWidth/2, y = e.clientY || innerHeight/3;
  floatText(x, y, '+' + fmt(v));
  burst(x, y, ['#ffd23f','#22e4ff','#ff4fd8'][Math.floor(Math.random()*3)]);
  render();
};

$('adbtn').onclick = () => {
  // Сюда подключается SDK рекламы (rewarded video). Сейчас — имитация.
  S.adUntil = Date.now() + AD_MS;
  sfx('ding');
  $('msg').textContent = '🎉 Бонус x2 активен на 60 секунд!';
  render();
};

function buy(id) {
  const d = DEFS.find(x => x.id === id), c = cost(d);
  if (S.credits < c) return;
  S.credits -= c; S.owned[id]++;
  sfx('buy');
  render();
  const el = document.querySelector(`.mod[data-id="${id}"]`);
  if (el) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}

function shopHTML() {
  return DEFS.map((d, i) => {
    const locked = !(i === 0 || S.life >= DEFS[i-1].base * 3);
    const c = cost(d);
    return `<div class="mod ${locked ? 'locked' : ''}" data-id="${d.id}" style="--c1:${d.c1};--c2:${d.c2}">
      <div class="ic">${d.icon}</div>
      <div class="info"><b>${d.name}<span class="lv">× ${S.owned[d.id]}</span></b>
      <small>${locked ? '🔒 Откроется позже' : d.desc + ' · +' + fmt(d.prod * coreMult() * adMult()) + '/с'}</small></div>
      <button class="btn" data-id="${d.id}" ${locked || S.credits < c ? 'disabled' : ''}>${locked ? '🔒' : fmt(c) + ' 💰'}</button>
    </div>`;
  }).join('');
}

function render() {
  const adOn = Date.now() < S.adUntil;
  $('credits').textContent = fmt(S.credits) + ' 💰';
  $('pps').textContent = '⚡ ' + fmt(perSec()) + ' 💰/с';
  $('cores').textContent = `✨ Звёздные ядра: ${cores()} (бонус +${cores()*10}%)`;
  $('clickval').textContent = '+' + fmt(clickVal()) + ' за клик';
  $('adbtn').disabled = adOn;
  $('adtext').textContent = adOn ? '📺 Бонус x2 активен!' : '📺 Реклама: x2 к доходу на 60 сек';

  const gain = Math.floor(Math.sqrt(S.life / LIFE_PER_CORE)) - cores();
  $('prestigebtn').disabled = gain < 1;
  $('prestigeinfo').textContent = S.life < LIFE_PER_CORE
    ? `Откроется после ${fmt(LIFE_PER_CORE)} 💰 за всё время`
    : `Сбросит станцию, но даст +${gain} ✨ (каждое +10% к доходу)`;

  const shop = $('shop');
  shop.innerHTML = shopHTML();
  shop.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => buy(b.dataset.id));
  if (cur === 'station') renderStation();
  if (cur === 'station') renderCosm();
}

$('prestigebtn').onclick = () => {
  if (!confirm('Перезапустить станцию? Монеты и модули сбросятся, ядра останутся.')) return;
  S = { credits:0, life:S.life, owned:{}, t:Date.now(), adUntil:0, cosm:S.cosm, skin:S.skin };
  DEFS.forEach(d => S.owned[d.id] = 0);
  sfx('prestige');
  $('msg').textContent = '🌌 Станция перезапущена. Бонус ядер активен!';
  render();
};

/* ---------- сохранение и офлайн ---------- */
function save() {
  S.t = Date.now();
  try { localStorage.setItem('spaceStation', JSON.stringify(S)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem('spaceStation');
    if (!raw) return;
    S = Object.assign(S, JSON.parse(raw));
    DEFS.forEach(d => { if (S.owned[d.id] === undefined) S.owned[d.id] = 0; });
    const secs = Math.min((Date.now() - S.t) / 1000, OFFLINE_CAP);
    if (secs > 5) {
      const got = perSec() * secs * OFFLINE_RATE;
      if (got > 0) { earn(got); $('msg').textContent = `🛰️ Пока тебя не было, станция добыла ${fmt(got)} 💰`; }
    }
  } catch (e) {}
}
let cur = 'play', lastStageKey = '', lastCosmKey = '';
const skin = () => SKINS.find(s => s.id === S.skin) || SKINS[0];

function renderStation() {
  const sk = skin(), list = [];
  DEFS.forEach(d => { for (let i = 0; i < Math.min(S.owned[d.id], 6); i++) list.push(d.icon); });
  const key = S.skin + list.join('');
  if (key !== lastStageKey) {
    lastStageKey = key;
    const n = Math.max(list.length, 1);
    $('stage').style.setProperty('--st1', sk.st1);
    $('stage').style.setProperty('--st2', sk.st2);
    $('stage').innerHTML = `<div class="core">${sk.icon}</div>` +
      list.map((ic, i) => `<div class="ring" style="--a:${i * 360 / n}deg"><span>${ic}</span></div>`).join('') +
      ['☄️','🪐','🛰️','👽','⭐','🌍','🛸','✨'].map((ic, i) => `<div class="amb" style="top:${8 + i * 11}%;--d:${8 + (i % 4) * 3}s;--dl:-${i * 2.5}s">${ic}</div>`).join('');
  }
  const total = DEFS.reduce((s, d) => s + S.owned[d.id], 0);
  $('stationinfo').textContent = `Модулей: ${total} · Доход: ${fmt(perSec())} 💰/с · ✨ ядра: ${cores()}`;
}

function renderCosm() {
  const key = S.skin + Object.keys(S.cosm).join() + SKINS.map(s => S.credits >= s.price ? 1 : 0).join('');
  if (key === lastCosmKey) return;
  lastCosmKey = key;
  $('cgrid').innerHTML = SKINS.map(s => {
    const have = !!S.cosm[s.id], eq = S.skin === s.id;
    const label = eq ? '✅ Надето' : have ? 'Надеть' : fmt(s.price) + ' 💰';
    const dis = eq || (!have && S.credits < s.price);
    return `<div class="card" style="--st1:${s.st1};--st2:${s.st2}"><div class="prev">${s.icon}</div><b>${s.name}</b><button class="btn" data-skin="${s.id}" ${dis ? 'disabled' : ''}>${label}</button></div>`;
  }).join('');
  $('cgrid').querySelectorAll('button[data-skin]').forEach(b => b.onclick = () => skinAction(b.dataset.skin));
}

function skinAction(id) {
  const s = SKINS.find(x => x.id === id);
  if (S.cosm[id]) { S.skin = id; sfx('ding'); }
  else if (S.credits >= s.price) { S.credits -= s.price; S.cosm[id] = true; S.skin = id; sfx('buy'); }
  else return;
  lastCosmKey = ''; lastStageKey = '';
  render();
}

function showTab(t) {
  cur = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  const map = { play:'scrPlay', station:'scrStation', cosm:'scrCosm' };
  Object.keys(map).forEach(k => {
    const el = $(map[k]);
    el.classList.toggle('hide', !(k === t || (t === 'station' && k === 'cosm')));
    if (k === t) { el.classList.remove('screen-in'); void el.offsetWidth; el.classList.add('screen-in'); }
  });
  render();
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => showTab(b.dataset.t));

load(); render();

/* ---------- игровой цикл ---------- */
let last = Date.now();
setInterval(() => {
  const now = Date.now();
  earn(perSec() * (now - last) / 1000);
  last = now;
  if (now > nextEvent) {
    eventUntil = now + EVENT_MS;
    nextEvent = now + 90000 + Math.random() * 60000;
    sfx('meteor');
    $('msg').textContent = '☄️ Метеоритный дождь! Всё x3';
  }
  const on = now < eventUntil;
  $('banner').style.display = on ? 'block' : 'none';
  $('banner').textContent = '☄️ Метеоритный дождь! Доход x3';
  if (on && Math.random() < 0.3) spawnMeteor();
  render();
}, 200);

setInterval(save, 3000);
addEventListener('beforeunload', save);
</script>
</body>
</html>
